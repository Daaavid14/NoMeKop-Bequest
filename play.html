<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomekop Bequest</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="backgrounds/pokemon-ball.png" type="image/x-icon">
</head>
<body>
    
<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="/backgrounds/nomekop.png" alt="Pokémon NFT Logo" />
      </div>
      <nav>
        <ul>
          <a href="index.html"><li> Home</li></a>
          <a href="marketplace.html"><li> Marketplace</li></a>
          <a href="#"><li> Game</li></a>
          <li class="mint-dropdown">
            <a href="#" class="mint-dropdown-trigger"> Mint <span class="dropdown-arrow">▼</span></a>
            <ul class="mint-submenu">
              <li><a href="mint.html">NFT Mint</a></li>
              <li><a href="mint-pkc.html">PKC Mint</a></li>
            </ul>
          </li>
        </ul>
      </nav>
      <div class="support">
        <p>Support Center</p>
        <p>Whitepaper</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
          <h2>Battle Arena</h2>

            <!-- Wrap both elements for hover consistency -->
            <div class="wallet-container">
                <!-- Balance Display Badge -->
                <div class="balance-badge">
                  <span id="navBalance">0 ETH | 0 PKC</span>
                </div>

                <button id="connectWalletBtn" class="wallet-btn">CONNECT WALLET</button>

                <div id="walletMenu" class="wallet-menu" aria-hidden="true">
                    <div class="wallet-menu-card">
                        <div class="wm-header">
                            <img src="" alt="Trainer Avatar" class="wm-avatar" id="wmAvatar" />
                            <div class="wm-info">
                            <h4 id="wmTrainerName">Trainer</h4>
                            <button class="wm-profile-btn">View Profile</button>
                        </div>
                    </div>

                    <div class="wm-address">
                        <span id="wmAddressShort">0x0000...0000</span>
                        <div class="wm-address-actions">
                            <button id="wmCopyBtn" class="wm-icon-btn" title="Copy Address">📋</button>
                            <a id="wmExplorer" target="_blank" rel="noopener" class="wm-icon-btn" title="View on Explorer">🔗</a>
                        </div>
                    </div>

                    <div class="wm-balance">
                        <p id="wmBalance">— ETH | — PKC</p>
                        <span id="wmNetwork" class="wm-network">—</span>
                    </div>

                    <div class="wm-stats">
                        <div class="wm-stat"><span>Pokémon</span><strong id="ownedNFTs">0</strong></div>
                        <div class="wm-stat"><span>Wins</span><strong id="battleWins">0</strong></div>
                        <div class="wm-stat"><span>Volume</span><strong id="volume">Ξ 0</strong></div>
                    </div>

                    <div class="wm-links">
                        <a href="#" class="wm-link">🎒 Inventory</a>
                        <a href="#" class="wm-link">⚙️ Settings</a>
                        <a href="#" class="wm-link">💬 Support</a>
                    </div>

                    <button id="wmLogoutBtn" class="wm-logout">➜] Log Out</button>
                    </div>
                </div>
            </div>
        </header>

        <section class="play-lobby">
            <header class="hero" id="homeSection">
                <div class="hero-left">
                    <img src="assets/sprites.png" alt="Pokemon Group">
                </div>
                <div class="hero-center">
                    <h1 class="title">NOMEKOP BEQUEST</h1>
                    <div class="hero-buttons">
                        <a href="lobby.html" id="navPlayGames">
                            <button class="btn play">PLAY GAME</button>
                        </a>
                    </div>
                        <p class="sub-text">Train • Battle • Trade</p>
                </div>
                <div class="hero-right">
                    <img src="assets/kind1.png" alt="Trainer Red">
                </div>
                <div id="walletPopup" class="wallet-popup" aria-hidden="true">
                    <div class="wallet-popup-backdrop"></div>
                </div>
            </header>
        </section>
        
    </main>
</div>

    <!-- index.html -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
    <script type="module" src="script/battle-arena.js"></script>
    <script type="module" src="script/dashboard.js"></script>
</body>
</html>
